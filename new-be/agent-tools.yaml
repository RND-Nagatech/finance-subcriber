version: v1
service: finance-subcriber
base_path: /api/agent/v1
read_only: true
authentication:
  type: service-jwt
  required_scope: subscriber:read
tools:
  - id: subscriber.list
    method: GET
    path: /subscribers
    risk: low
    description: List active or requested-status subscriber records with annual billing summary.
    use_when: The agent needs subscriber, outlet, program, contact, or billing context.
    do_not_use_when: The request is for subscription invoices, payments, VPS, Finance, Asset, or Travel Expense data.
    parameters: [search, status, groupCode, year, month, page, limit]
  - id: subscriber.detail
    method: GET
    path: /subscribers/{id}
    risk: low
    description: Return one subscriber by stable id or subscriber code.
    use_when: The agent needs one subscriber record and annual billing summary.
    do_not_use_when: The caller needs to create, edit, or delete a subscriber.
    parameters: [id, fiscalYear]
  - id: subscriber.summary
    method: GET
    path: /subscribers/summary
    risk: low
    description: Return current subscriber counts and fees grouped by subscriber status.
    use_when: The agent needs a current subscriber KPI summary.
    do_not_use_when: The caller needs subscription transaction history.
    parameters: []
  - id: subscriber.years
    method: GET
    path: /subscribers/years
    risk: low
    description: List years available from subscriber registration dates.
    use_when: The agent needs to resolve a valid subscriber reporting year.
    do_not_use_when: The caller needs to change fiscal configuration.
    parameters: []
  - id: subscriber.growth
    method: GET
    path: /subscribers/metrics/growth/{year}
    risk: low
    description: Return new active subscriber counts by fiscal month.
    use_when: The agent needs subscriber acquisition trend.
    do_not_use_when: The caller needs subscription revenue reporting.
    parameters: [year]
  - id: subscriber.cumulative
    method: GET
    path: /subscribers/metrics/cumulative/{year}
    risk: low
    description: Return cumulative active subscriber counts by fiscal month.
    use_when: The agent needs subscriber base trend.
    do_not_use_when: The caller needs subscription invoice balances.
    parameters: [year]
  - id: subscriber.by-program
    method: GET
    path: /subscribers/metrics/by-program
    risk: low
    description: Return active subscriber totals and fees grouped by program.
    use_when: The agent needs program mix or subscriber distribution.
    do_not_use_when: The caller needs to modify program assignments.
    parameters: [fiscalYear, month]
